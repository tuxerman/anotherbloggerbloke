---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ title }}</h1>
    <p class="post-meta">{{ date | postDate }}{% if author %} • {{ author }}{% endif %}{% if meta %} • {{ meta }}{% endif %}</p>
  </header>


  <article class="post-content">
    {{ content }}
    <br/>
    <hr/>
    <br/>
    {% if bloggerlink %} <a href="{{ bloggerlink }}"> <i class="fa fa-rss" aria-hidden="true"></i>
View original content </a>{% endif %}
  </article>

</div>
